{% extends 'base.html' %}
{% load static %}
{%block title%}Profile{% endblock %}
{% block content %}
    <h1>Verification Request</h1>
    {% if verification_request.front_id %}
        <img src="{{ verification_request.front_id.url }}" width="150" height="150">
    {% else %}
        <img src="{% static 'images/default-avatar.jpg' %}" alt="Default Avatar" width="150" height="150">
    {% endif %}
{% endblock %}
