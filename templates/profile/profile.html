{% extends 'base.html' %}
{%block title%}Profile{% endblock %}
{% block content %}
    <h1>Name: {{user.first_name}} {{user.last_name}}</h1>
    <form action="{% url 'profile:profile' %}" method="POST">
        {% csrf_token %}

        {{ form.as_div }}
        <div>
            <input type="submit" value="Save Changes">
        </div>
    </form>
{% endblock %}
