{% extends 'base.html' %}
{%block title%}Log In{% endblock %}
{% block content %}
    <h1>Log In Form</h1>
    <form method="POST">
        {% csrf_token%}

        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>
    <div>
        <a href="{% url 'register:register' %}">Register</a>
    </div>
    
{% endblock %}
